    <path d="M230 400 350 160 470 400"/>
    <path d="M370 400 480 160h110v240" stroke-opacity=".5"/>
  </g>

  <!-- universe of discourse -->
  <path d="M96 400h608" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#1c1917" fill-opacity=".45">
    <circle cx="180" cy="400" r="5"/><circle cx="350" cy="400" r="5"/><circle cx="530" cy="400" r="5"/>
  </g>
  <circle cx="350" cy="160" r="10" fill="#e8a317" stroke="#1c1917" stroke-width="2.5"/>
</svg>
